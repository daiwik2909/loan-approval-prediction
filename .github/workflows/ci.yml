name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The Kaggle CSVs are committed (under 10 MB). If they are ever missing,
      # fall back to a small synthetic fixture so the pipeline still runs.
      - name: Select training data
        run: |
          if [ -f data/raw/train.csv ]; then
            echo "DATA=data/raw/train.csv" >> "$GITHUB_ENV"
          else
            python data/make_ci_fixture.py data/ci_fixture.csv
            echo "DATA=data/ci_fixture.csv" >> "$GITHUB_ENV"
          fi

      - name: Train baseline model (logistic regression)
        run: >
          python train.py --model logistic_regression --data "$DATA" --test ""
          --output /tmp/ci_model/model.joblib --save always --no_mlflow --cv_folds 3

      - name: Run tests against the committed model
        run: pytest -v --tb=short

      - name: Check serving requirements are importable
        run: python -c "import app; print('app imports OK')"